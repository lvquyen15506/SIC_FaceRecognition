version: '3.8'

services:
  db:
    image: ankane/pgvector:v0.5.1
    container_name: sic_facerecognition_db
    environment:
      POSTGRES_DB: sic_facerecognition
      POSTGRES_USER: sic_user
      POSTGRES_PASSWORD: sic_password_2026
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sic_user -d sic_facerecognition"]
      interval: 3s
      timeout: 3s
      retries: 10
    networks:
      - sic_network

  backend:
    build:
      context: .
      dockerfile: web_app/backend/Dockerfile
    image: face_recognition_project-backend:latest
    container_name: sic_facerecognition_backend
    security_opt:
      - no-new-privileges:true
    ports:
      - "8000:8000"
    volumes:
      - ./data_gallery:/app/data_gallery
      - ./reports:/app/reports
      - ./web_app/backend/main.py:/app/main.py
      - ./web_app/backend/app:/app/app
    environment:
      - SECRET_KEY=sic_face_recognition_super_secret_jwt_key_2026
      - DATABASE_URL=postgresql://sic_user:sic_password_2026@db:5432/sic_facerecognition
      - GALLERY_PATH=/app/data_gallery
      - REPORTS_PATH=/app/reports
    depends_on:
      db:
        condition: service_healthy
    networks:
      - sic_network

  frontend:
    build:
      context: ./web_app/frontend
      dockerfile: Dockerfile
    image: face_recognition_project-frontend:latest
    container_name: sic_facerecognition_frontend
    security_opt:
      - no-new-privileges:true
    ports:
      - "3000:8080"
    depends_on:
      - backend
    networks:
      - sic_network

volumes:
  postgres_data:

networks:
  sic_network:
    driver: bridge
    name: sic_facerecognition_net
