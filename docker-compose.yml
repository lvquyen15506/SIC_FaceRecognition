version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: web_app/backend/Dockerfile
    container_name: sic_facerecognition_backend
    user: "1000:1000"
    security_opt:
      - no-new-privileges:true
    ports:
      - "8000:8000"
    volumes:
      - ./data_gallery:/app/data_gallery
      - ./reports:/app/reports
    environment:
      - SECRET_KEY=sic_face_recognition_super_secret_jwt_key_2026
    restart: unless-stopped

  frontend:
    build:
      context: ./web_app/frontend
      dockerfile: Dockerfile
    container_name: sic_facerecognition_frontend
    security_opt:
      - no-new-privileges:true
    ports:
      - "3000:8080"
    depends_on:
      - backend
    restart: unless-stopped
